# Основной конфиг nginx (вместо стандартного из образа). Отличие — лимиты под тысячи WebSocket:
# в образе worker_connections 1024 на воркер, а каждый WebSocket занимает два соединения
# (клиент + upstream nexus) — то есть ~1000 чатов на весь сервер. Сайт — в conf.d/default.conf.
user  nginx;
worker_processes  auto;
# Дескрипторов на воркер: соединения x2 (клиент + upstream) + файлы кэша обложек.
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    # На воркер (2 ядра — 2 воркера): до ~16 тыс. WebSocket всего; ~2–3 КБ памяти на соединение.
    worker_connections  16384;
    multi_accept  on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main buffer=32k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}

# Кэш обложек книг (`/covers/...`): картинки Open Library и Google Books, на диске gateway
# (том coverscache). Файлы только в кэше — в базе и репозитории их нет; очистка — удалить том.
proxy_cache_path /var/cache/nginx/covers levels=1:2 keys_zone=covers:10m max_size=2g
                 inactive=90d use_temp_path=off;

server {
    listen 80;
    server_name _;

    # DNS Docker. Адрес app берём из переменной, чтобы nginx переспрашивал его, а не запоминал
    # при старте: после пересоздания контейнера app его IP меняется, и без этого был бы 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:8080;

    # Обложки Open Library: цепочка из двух перенаправлений через error_page (см. /covers/ol).
    recursive_error_pages on;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Маршрутизация по модулям (/api/v1/auth, /api/v1/catalog, ...) делается в самом приложении.
    # proxy_pass с переменной и без пути передаёт URI запроса как есть.
    location / {
        proxy_pass $app;
        include /etc/nginx/proxy_common.conf;
    }

    # WebSocket: нужен апгрейд соединения и длинные таймауты.
    location /ws {
        proxy_pass $app;
        include /etc/nginx/proxy_common.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Обложки книг через кэш: первый запрос идёт к источнику (Open Library — секунды, через
    # archive.org), следующие — с диска. `cover_url` книг — `{PUBLIC_URL}/covers/...`
    # (scripts/books-import/google_books.py). Хосты — переменными: резолвятся при запросе, и
    # недоступный источник не мешает gateway стартовать.
    #   /covers/ol/b/id/123-L.jpg        → https://covers.openlibrary.org/b/id/123-L.jpg
    #   /covers/google/books/content?... → https://books.google.com/books/content?...
    location ~ ^/covers/ol/(?<cover_path>.+)$ {
        set $cover_host covers.openlibrary.org;
        proxy_pass https://$cover_host/$cover_path;
        proxy_set_header Host $cover_host;
        # Open Library отвечает 302 на archive.org — идём по ссылке сами, кэш по исходному URI.
        proxy_intercept_errors on;
        error_page 301 302 307 = @cover_redirect;
        include /etc/nginx/covers_cache.conf;
    }

    location ~ ^/covers/google/(?<cover_path>.+)$ {
        set $cover_host books.google.com;
        proxy_pass https://$cover_host/$cover_path$is_args$args;
        proxy_set_header Host $cover_host;
        include /etc/nginx/covers_cache.conf;
    }

    # covers.openlibrary.org → archive.org/download/… → ia*.us.archive.org/view_archive.php?…:
    # два перенаправления, каждое проходит nginx (иначе браузер ушёл бы мимо кэша).
    location @cover_redirect {
        set $cover_target $upstream_http_location;
        proxy_pass $cover_target;
        proxy_intercept_errors on;
        error_page 301 302 307 = @cover_redirect_2;
        include /etc/nginx/covers_cache.conf;
    }

    location @cover_redirect_2 {
        # После внутреннего перенаправления `$upstream_http_location` — значения всех шагов
        # через " : "; нужен последний.
        set $cover_target $upstream_http_location;
        if ($cover_target ~ "([^ ]+)$") {
            set $cover_target $1;
        }
        proxy_pass $cover_target;
        include /etc/nginx/covers_cache.conf;
    }
}

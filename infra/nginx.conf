# Кэш обложек книг (`/covers/...`): картинки Open Library и Google Books, на диске gateway
# (том coverscache). Файлы только в кэше — в базе и репозитории их нет; очистка — удалить том.
proxy_cache_path /var/cache/nginx/covers levels=1:2 keys_zone=covers:10m max_size=2g
                 inactive=90d use_temp_path=off;

# Клиент принимает brotli (Accept-Encoding: …, br, …): книги ему — готовым .br с диска. Без if:
# остальным к имени файла добавляется «.nobr» — такого файла нет, и try_files уводит в Node.
map $http_accept_encoding $nexus_br_suffix {
    default ".nobr";
    "~*\bbr\b" "";
}

# Сервер фронтенда на хосте (`pnpm dev` / `pnpm serve` в nexus_web, :3000). upstream, а не
# переменная: host.docker.internal есть только в /etc/hosts контейнера (extra_hosts), DNS Docker
# его не знает, а upstream разрешается при старте nginx — в том числе по /etc/hosts.
upstream nexus_web {
    server host.docker.internal:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # DNS Docker. Адрес app берём из переменной, чтобы nginx переспрашивал его, а не запоминал
    # при старте: после пересоздания контейнера app его IP меняется, и без этого был бы 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:8080;

    # Обложки Open Library: цепочка из двух перенаправлений через error_page (см. /covers/ol).
    recursive_error_pages on;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Фронтенд (nexus_web) — как на проде: `pnpm dev` собирает сайт и запускает его сервер
    # (node server/index.js) на хосте :3000. Готовые страницы (карточки, книги) nginx отдаёт
    # с диска — каталог сборки nexus_web примонтирован в /srv/nexus-web/build; нет файла —
    # Node рисует, сохраняет, и следующий запрос снова с диска. Сайт — http://localhost.

    # Маршрутизация по модулям (/api/v1/auth, /api/v1/catalog, ...) делается в самом приложении.
    # proxy_pass с переменной и без пути передаёт URI запроса как есть.
    location /api/ {
        proxy_pass $app;
        include /etc/nginx/proxy_common.conf;
    }

    location ~ ^/(docs|api-docs|health)(/|$) {
        proxy_pass $app;
        include /etc/nginx/proxy_common.conf;
    }

    # Перерисовка статики — только изнутри (бэкенд ходит на ISR_URL напрямую).
    location /_isr/ {
        return 404;
    }

    # Ассеты сборки: в имени хэш — кэш навсегда.
    location /_app/immutable/ {
        root /srv/nexus-web/build/client;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @web;
    }

    # Книги: их сотни тысяч, на диске они лежат только сжатыми (.br) и по папкам из первых двух
    # символов slug (staticFiles, brOnly в nexus_web/server/isr.js). Адрес сайта не меняется:
    # /books/belaya-gvardiya → books/be/belaya-gvardiya.html.br. Браузеру с brotli (~97%) nginx
    # отдаёт .br как есть, с Content-Encoding: br — модуль brotli для этого не нужен. Остальных
    # (старые браузеры, превью ссылок, curl) — в Node: он распакует тот же файл, без API и базы.
    # Эти location — раньше общего: regex-локации проверяются по порядку.
    location ~ "^/books/(?<book>(?<shard>[a-z0-9-]{1,2})[a-z0-9-]*)/__data\.json$" {
        root /srv/nexus-web/build/prerendered;
        gzip off;
        types { }
        default_type application/json;
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding;
        add_header Cache-Control "public, max-age=300";
        add_header X-Static "nginx";
        try_files /books/$shard/$book/__data.json.br$nexus_br_suffix @web;
    }

    location ~ "^/books/(?<book>(?<shard>[a-z0-9-]{1,2})[a-z0-9-]*)$" {
        root /srv/nexus-web/build/prerendered;
        gzip off;
        types { }
        default_type "text/html; charset=utf-8";
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding;
        add_header Cache-Control "public, max-age=300";
        add_header X-Static "nginx";
        try_files /books/$shard/$book.html.br$nexus_br_suffix @web;
    }

    # Остальные карточки, студии, премии — плоско (STATIC_PAGE в server/isr.js).
    location ~ "^(/(films|series|games|paintings|studios)/[a-z0-9]+(-[a-z0-9]+)*|/awards/[a-z0-9]+(-[a-z0-9]+)*(/[0-9]{4})?)(/__data\.json)?$" {
        root /srv/nexus-web/build/prerendered;
        gzip_static on;
        add_header Cache-Control "public, max-age=300";
        add_header X-Static "nginx";
        try_files $uri.html $uri @web;
    }

    # Остальное: файлы из static/ сборки, затем сервер фронтенда (SSR).
    location / {
        root /srv/nexus-web/build/client;
        gzip_static on;
        try_files $uri @web;
    }

    location @web {
        proxy_pass http://nexus_web;
        include /etc/nginx/proxy_common.conf;
        # keepalive к upstream: HTTP/1.1 без «Connection: close».
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # WebSocket: нужен апгрейд соединения и длинные таймауты.
    location /ws {
        proxy_pass $app;
        include /etc/nginx/proxy_common.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Обложки книг библиотеки Cassandra — файлы с диска (том приложения, BOOK_COVERS_DIR):
    #   /covers/books/104215-113436/113037.avif → /var/lib/nexus/book-covers/104215-113436/113037.avif
    # Файл заменяется по тому же пути (`PUT /admin/entities/{id}/cover`), поэтому кэш — сутки,
    # без `immutable`: после него браузер перепроверяет файл по ETag/Last-Modified.
    location ^~ /covers/books/ {
        alias /var/lib/nexus/book-covers/;
        types { image/avif avif; image/jpeg jpg jpeg; image/png png; image/webp webp; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
    }

    # Обложки книг через кэш: первый запрос идёт к источнику (Open Library — секунды, через
    # archive.org), следующие — с диска. `cover_url` книг — `{PUBLIC_URL}/covers/...`
    # (scripts/books-import/google_books.py). Хосты — переменными: резолвятся при запросе, и
    # недоступный источник не мешает gateway стартовать.
    #   /covers/ol/b/id/123-L.jpg        → https://covers.openlibrary.org/b/id/123-L.jpg
    #   /covers/google/books/content?... → https://books.google.com/books/content?...
    location ~ ^/covers/ol/(?<cover_path>.+)$ {
        set $cover_host covers.openlibrary.org;
        proxy_pass https://$cover_host/$cover_path;
        proxy_set_header Host $cover_host;
        # Open Library отвечает 302 на archive.org — идём по ссылке сами, кэш по исходному URI.
        proxy_intercept_errors on;
        error_page 301 302 307 = @cover_redirect;
        include /etc/nginx/covers_cache.conf;
    }

    location ~ ^/covers/google/(?<cover_path>.+)$ {
        set $cover_host books.google.com;
        proxy_pass https://$cover_host/$cover_path$is_args$args;
        proxy_set_header Host $cover_host;
        include /etc/nginx/covers_cache.conf;
    }

    # covers.openlibrary.org → archive.org/download/… → ia*.us.archive.org/view_archive.php?…:
    # два перенаправления, каждое проходит nginx (иначе браузер ушёл бы мимо кэша).
    location @cover_redirect {
        set $cover_target $upstream_http_location;
        proxy_pass $cover_target;
        proxy_intercept_errors on;
        error_page 301 302 307 = @cover_redirect_2;
        include /etc/nginx/covers_cache.conf;
    }

    location @cover_redirect_2 {
        # После внутреннего перенаправления `$upstream_http_location` — значения всех шагов
        # через " : "; нужен последний.
        set $cover_target $upstream_http_location;
        if ($cover_target ~ "([^ ]+)$") {
            set $cover_target $1;
        }
        proxy_pass $cover_target;
        include /etc/nginx/covers_cache.conf;
    }
}

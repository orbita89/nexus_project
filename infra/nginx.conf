server {
    listen 80;
    server_name _;

    # DNS Docker. Адрес app берём из переменной, чтобы nginx переспрашивал его, а не запоминал
    # при старте: после пересоздания контейнера app его IP меняется, и без этого был бы 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:8080;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Маршрутизация по модулям (/api/v1/auth, /api/v1/catalog, ...) делается в самом приложении.
    # proxy_pass с переменной и без пути передаёт URI запроса как есть.
    location / {
        proxy_pass $app;
        include /etc/nginx/proxy_common.conf;
    }

    # WebSocket: нужен апгрейд соединения и длинные таймауты.
    location /ws {
        proxy_pass $app;
        include /etc/nginx/proxy_common.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

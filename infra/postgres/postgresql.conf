# PostgreSQL 18 для слабого сервера: 2 ГБ RAM на всё (PG 384 МБ + nexus 1 ГБ + nginx/ОС), 2 ядра.
# Сайт в основном статика; нагрузка — чат по WebSocket (запись пачками, см. social::chat).
# Linux кэширует файлы БД в page cache сам и отдаёт эту память при нехватке — поэтому
# shared_buffers маленький, а effective_cache_size (только подсказка) — больше.

listen_addresses = '*'

# --- Соединения ---
max_connections = 20                    # пул nexus (5) + psql/бэкапы/миграции
superuser_reserved_connections = 2
idle_in_transaction_session_timeout = 30s
# statement_timeout глобально не ставим: его ловят ожидание advisory-lock (миграции sqlx при
# старте, создание тестовых БД) и длинные миграции.

# --- Память ---
shared_buffers = 64MB
huge_pages = off
work_mem = 2MB
maintenance_work_mem = 64MB
autovacuum_work_mem = 16MB
temp_buffers = 4MB
effective_cache_size = 512MB
wal_buffers = 2MB

# --- Без тяжёлых фоновых фич ---
jit = off                               # LLVM JIT: десятки МБ на процесс, на простых запросах вреден
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0

# --- WAL и чекпоинты ---
# Реплик нет: минимальный WAL. pg_dump работает; pg_basebackup/PITR — нет.
wal_level = minimal
max_wal_senders = 0
# Коммит не ждёт fsync: при падении ОС теряются последние ~0,6 с транзакций, база не портится.
synchronous_commit = off
wal_writer_delay = 200ms
wal_compression = lz4
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 256MB
min_wal_size = 32MB

# --- Планировщик (SSD) ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Autovacuum: один воркер, но чаще на горячих таблицах (пороги — в миграции) ---
autovacuum_max_workers = 1
autovacuum_naptime = 30s

# --- Наблюдение ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 1000
pg_stat_statements.track = top
track_io_timing = on
log_min_duration_statement = 500ms
log_checkpoints = off

# Общие настройки кэша обложек (`location /covers/...` в nginx.conf).
proxy_ssl_server_name on;
proxy_cache covers;
proxy_cache_key $uri$is_args$args;
proxy_cache_valid 200 90d;
proxy_cache_valid 404 1d;
# Источники ставят короткий Cache-Control и куки — кэшируем по своим правилам.
proxy_ignore_headers Cache-Control Expires Set-Cookie;
proxy_hide_header Set-Cookie;
# Один запрос к источнику на обложку, даже если её открыли сразу многие; источник упал —
# отдаём то, что уже в кэше.
proxy_cache_lock on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_read_timeout 30s;
add_header X-Cache-Status $upstream_cache_status always;
add_header Cache-Control "public, max-age=2592000" always;

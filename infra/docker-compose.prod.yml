# Staging и прод: приложение из готового образа (infra/Dockerfile, публикует CI в GHCR),
# без исходников, cargo watch, Mailpit и dev login. Одно и то же для staging и прода — разные
# только значения в env-файле. Подробно — documents/deploy.md.
#
#   cp infra/.env.prod.example infra/.env.prod   # заполнить секреты, файл не коммитится
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d
#
# Обязательные переменные заданы как ${VAR:?...}: без них compose не стартует, а не поднимает
# прод с паролем по умолчанию. Наружу открыт только nginx; Postgres и Redis — нет.

name: "nexus-${NEXUS_ENV:?NEXUS_ENV is required (staging or production)}"

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      # С 18-й версии образ хранит данные в /var/lib/postgresql/18/docker, том — на /var/lib/postgresql.
      # Новое имя тома: старый (pgdata, PostgreSQL 17) 18-я версия не прочитает.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Тег — sha коммита из CI: на прод уходит ровно тот образ, что прошёл staging.
    image: ${NEXUS_IMAGE:?NEXUS_IMAGE is required, e.g. ghcr.io/orbita89/nexus_project:<sha>}
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (openssl rand -base64 48)}
      SMTP_URL: ${SMTP_URL:?SMTP_URL is required (smtps://user:pass@host:465)}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required (адрес фронтенда)}
      # Ревалидация статики фронтенда (POST {ISR_URL}/_isr/revalidate). Без них страницы
      # карточек не пересобираются после правок в админке.
      ISR_URL: ${ISR_URL:-}
      ISR_SECRET: ${ISR_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required (адрес API)}
      # Swagger UI: на staging удобно, на проде можно выключить.
      API_DOCS: ${API_DOCS:-false}
      # Вход без пароля — никогда вне dev.
      DEV_LOGIN: "false"
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_YANDEX_CLIENT_ID: ${OAUTH_YANDEX_CLIENT_ID:-}
      OAUTH_YANDEX_CLIENT_SECRET: ${OAUTH_YANDEX_CLIENT_SECRET:-}
      # Постеры и трейлеры: docker compose ... exec app nexus media check (по cron, см. deploy.md).
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      AI_SECRET_KEY: ${AI_SECRET_KEY:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      RUST_LOG: ${RUST_LOG:-info}
      # Холодный архив каталога (Tantivy, mmap): ~1 млн фильмов — сотни МБ на диске.
      ARCHIVE_DIR: /var/lib/nexus/archive
      # Все индексы Tantivy: books, people, works, archive, collections. Обязателен: без него поиск отвечает 503.
      SEARCH_INDEX_DIR: ${SEARCH_INDEX_DIR-/var/lib/nexus/tantivy}
      # Прод только читает индекс: собирается локально по дампу базы и выкладывается готовой
      # папкой. Ни перестройки, ни пересборки слоя Б, ни фоновых циклов — ни пика памяти, ни CPU.
      SEARCH_INDEX_READONLY: ${SEARCH_INDEX_READONLY-1}
      # Аллокатор сразу отдаёт освобождённое ОС (после пика нагрузки куча не остаётся раздутой:
      # замер — 112 МБ против 184 МБ с задержкой по умолчанию).
      MIMALLOC_PURGE_DELAY: ${MIMALLOC_PURGE_DELAY-0}
      # Потоков для поиска: лишние запросы ждут в очереди, а не множат память и CPU.
      NEXUS_BLOCKING_THREADS: ${NEXUS_BLOCKING_THREADS-4}
      # Индекс книг (по умолчанию <SEARCH_INDEX_DIR>/books). Строит `nexus books index` (и сам
      # сервер, если каталог пуст).
      BOOKS_INDEX_DIR: ${BOOKS_INDEX_DIR-/var/lib/nexus/books-index}
      # Обложки книг библиотеки Cassandra: раздаёт gateway по /covers/books/.
      BOOK_COVERS_DIR: /var/lib/nexus/book-covers
      # Вложения чата — на том же томе: их надо бэкапить вместе с остальными данными.
      ATTACHMENTS_DIR: /var/lib/nexus/attachments
      # Фото профиля — там же, рядом с вложениями.
      AVATARS_DIR: /var/lib/nexus/avatars
      # Читалка книг: тома .arx — на HDD (только чтение), извлечённые EPUB — кэш на быстром диске
      # с жёстким пределом: сверх BOOKS_EPUB_CACHE_MB удаляются давно не открытые книги, брошенные
      # .tmp-* и пустые каталоги (catalog::books::reader). Без BOOKS_ARCHIVES_HOST читалка — 503.
      BOOKS_ARCHIVES_DIR: /srv/book-archives
      BOOKS_EPUB_CACHE_DIR: /var/cache/nexus-epub
      BOOKS_EPUB_CACHE_MB: ${BOOKS_EPUB_CACHE_MB:-2048}
    volumes:
      - archivedata:/var/lib/nexus
      # HDD с архивами книг (путь на сервере).
      - ${BOOKS_ARCHIVES_HOST:-/mnt/books/archives}:/srv/book-archives:ro
      # Кэш EPUB — отдельный том (на SSD), не внутри контейнера и не в /tmp: его можно
      # очистить целиком (`docker volume rm`), данные сайта он не затрагивает.
      - epubcache:/var/cache/nexus-epub
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Единственная точка входа. Тот же конфиг, что в dev. HTTPS добавляется, когда будут сервер
  # и домен (documents/deploy.md, «HTTPS»).
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      - ./covers_cache.conf:/etc/nginx/covers_cache.conf:ro
      # Кэш обложек книг (`/covers/...`, nginx.conf).
      - coverscache:/var/cache/nginx/covers
      # Обложки книг библиотеки Cassandra (`/covers/books/...`): файлы из тома приложения.
      - archivedata:/var/lib/nexus:ro
    depends_on:
      - app

volumes:
  coverscache:
  epubcache:
  pgdata18:
  redisdata:
  archivedata:

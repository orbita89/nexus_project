# Dev-окружение Nexus.
# Креды заданы дефолтами прямо здесь — окружение поднимается без дополнительных файлов.
# Чтобы переопределить, создайте infra/.env с теми же ключами: compose подхватит его автоматически.

services:
  postgres:
    image: postgres:18-alpine
    # Настройки под слабый сервер (1 ГБ RAM): infra/postgres/postgresql.conf.
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf",
              # Тесты (#[sqlx::test]) открывают много соединений параллельно.
              "-c", "max_connections=100"]
    shm_size: 64m
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
    ports:
      - "5432:5432"
    volumes:
      # С 18-й версии образ хранит данные в /var/lib/postgresql/18/docker, том — на /var/lib/postgresql.
      # Новое имя тома: старый (pgdata, PostgreSQL 17) 18-я версия не прочитает.
      - pgdata18:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    container_name: nexus-app
    restart: unless-stopped
    command: ["cargo", "watch", "-x", "run -p nexus"]
    # Внешние имена — через публичные DNS: резолвер по умолчанию (например, Яндекс) отвечает на
    # files.tmdb.org заглушкой 127.0.0.1, и «Обновить рейтинги» не скачивает дамп TMDB. Имена
    # сервисов (postgres, mailpit, …) по-прежнему резолвит встроенный DNS Docker.
    dns: [1.1.1.1, 8.8.8.8]
    # Сервер фронтенда (ISR_URL) запущен на хосте.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/app
      - cargo-registry:/cargo-cache
      # Сборка вне /app (CARGO_TARGET_DIR=/target в Dockerfile.dev): в проекте не появляется target/ от root.
      - app-target:/target
      # Холодный архив каталога (Tantivy) и дампы `nexus archive`: вне /app, иначе cargo watch
      # перезапускал бы приложение на каждую запись индекса.
      - archivedata:/var/lib/nexus
      # Архивы книг Cassandra (.arx) для читалки — только чтение. На сервере — HDD,
      # путь задаёт BOOKS_ARCHIVES_HOST.
      - ${BOOKS_ARCHIVES_HOST:-/home/dev/cassandra.books/data/archives}:/srv/book-archives:ro
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nexus_user}:${POSTGRES_PASSWORD:-nexus_password}@postgres:5432/${POSTGRES_DB:-nexus_db}
      # Перестройка поиска переключается на индекс любого размера: в разработке каталог часто
      # перезаливается целиком. В проде (docker-compose.prod.yml) — по умолчанию 80%.
      SEARCH_REINDEX_MIN_PERCENT: ${SEARCH_REINDEX_MIN_PERCENT:-0}
      # Индекс холодного архива (catalog::archive): GET /catalog/archive/search, промоушен,
      # nexus archive dump|build.
      ARCHIVE_DIR: /var/lib/nexus/archive
      # Все индексы Tantivy: books, people, works, archive, collections. Обязателен: без него поиск отвечает 503.
      SEARCH_INDEX_DIR: ${SEARCH_INDEX_DIR-/var/lib/nexus/tantivy}
      # Индекс книг (по умолчанию <SEARCH_INDEX_DIR>/books). Строит `nexus books index` (и сам
      # сервер, если каталог пуст).
      BOOKS_INDEX_DIR: ${BOOKS_INDEX_DIR-/var/lib/nexus/books-index}
      # Обложки книг библиотеки Cassandra: сюда их копирует `nexus books cassandra`, раздаёт
      # gateway по /covers/books/ (тот же том смонтирован в nginx только для чтения).
      BOOK_COVERS_DIR: /var/lib/nexus/book-covers
      # Читалка: архивы .arx (GET /catalog/books/{slug}/epub) и кэш извлечённых EPUB.
      BOOKS_ARCHIVES_DIR: /srv/book-archives
      BOOKS_EPUB_CACHE_DIR: /var/lib/nexus/epub-cache
      BOOKS_EPUB_CACHE_MB: ${BOOKS_EPUB_CACHE_MB:-2048}
      # Вложения чата: тот же том, что у архива — вне /app, иначе cargo watch перезапускал бы
      # приложение на каждую загруженную картинку.
      ATTACHMENTS_DIR: /var/lib/nexus/attachments
      # Фото профиля — там же, рядом с вложениями.
      AVATARS_DIR: /var/lib/nexus/avatars
      # Возврат фильма из архива открытием его страницы: не больше N в час (0 — выключен).
      ARCHIVE_RESTORE_PER_HOUR: ${ARCHIVE_RESTORE_PER_HOUR:-300}
      # Не короче 32 символов. В проде — свой случайный секрет (openssl rand -base64 48).
      JWT_SECRET: ${JWT_SECRET:-nexus-dev-jwt-secret-change-me-in-production}
      # Письма уходят в Mailpit: веб-интерфейс http://localhost:8025.
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-Nexus <no-reply@nexus.local>}
      # Фронтенд: из него строятся ссылки в письмах.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      # Ревалидация статики фронтенда после правок в админке: POST {ISR_URL}/_isr/revalidate.
      # Сервер фронтенда (nexus_web, `pnpm dev` = сборка + node server/index.js) — на хосте :3000.
      # Секрет — тот же, что ISR_SECRET у nexus_web. Пусто — шаг пропускается.
      ISR_URL: ${ISR_URL:-http://host.docker.internal:3000}
      ISR_SECRET: ${ISR_SECRET:-nexus-dev-isr-secret}
      # Публичный адрес API: из него строится redirect_uri для OAuth-провайдеров.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      # POST /api/v1/auth/dev/login — вход под любым пользователем. Только для dev, в проде false.
      DEV_LOGIN: ${DEV_LOGIN:-true}
      # OAuth-провайдеры включаются ключами (как получить — documents/modules/auth.md):
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_YANDEX_CLIENT_ID: ${OAUTH_YANDEX_CLIENT_ID:-}
      OAUTH_YANDEX_CLIENT_SECRET: ${OAUTH_YANDEX_CLIENT_SECRET:-}
      # Постеры и трейлеры (nexus media fill|check, make media): TMDB — фильмы и сериалы,
      # IGDB через приложение Twitch — игры. Без ключей ищутся только обложки книг и Rutube.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Шифрование ключей провайдеров ИИ в БД (catalog_ai_providers, make books-llm).
      AI_SECRET_KEY: ${AI_SECRET_KEY:-dev-ai-secret}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      # Пул как раньше: в dev идут импорты и перестройки параллельно с сайтом. В проде — 5.
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info,tower_http=debug}
      RUST_BACKTRACE: "1"
      # На машине ~6 ГБ свободной RAM: без лимита параллельные rustc её выедают.
      CARGO_BUILD_JOBS: "2"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Инструменты разработчика без Rust на машине: make ci-docker, make test-docker, make shell.
  # Не стартует с make up (profile tools), запускается через docker compose run. Свои тома для
  # сборки и кеша крейтов: не мешает cargo watch в app. Запускается от пользователя хоста
  # (--user в Makefile), чтобы созданные файлы (fmt, documents/api) не стали root'овыми.
  tools:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    profiles: ["tools"]
    volumes:
      - ..:/app
      - tools-cargo:/cargo-cache
      - tools-target:/target
    environment:
      HOME: /tmp
      DATABASE_URL: postgres://${POSTGRES_USER:-nexus_user}:${POSTGRES_PASSWORD:-nexus_password}@postgres:5432/${POSTGRES_DB:-nexus_db}
      CARGO_BUILD_JOBS: "2"
    depends_on:
      postgres:
        condition: service_healthy

  # Ловушка для писем в dev: всё, что отправляет приложение, видно на http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"   # веб-интерфейс и API
      - "1025:1025"   # SMTP

  nginx:
    image: nginx:1.27-alpine
    container_name: nexus-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      - ./covers_cache.conf:/etc/nginx/covers_cache.conf:ro
      # Кэш обложек книг (`/covers/...`, nginx.conf).
      - coverscache:/var/cache/nginx/covers
      # Обложки книг библиотеки Cassandra (`/covers/books/...`): файлы из тома приложения.
      - archivedata:/var/lib/nexus:ro
      # Фронтенд (nexus_web рядом с этим репозиторием): nginx берёт из него build/ — готовые
      # страницы и ассеты. Монтируем весь каталог, а не build/: сборка удаляет build/ и создаёт
      # заново, и примонтированный build/ остался бы старым, удалённым.
      - ${WEB_DIR:-../../nexus_web}:/srv/nexus-web:ro
    # Сервер фронтенда запущен на хосте (`pnpm dev` в nexus_web, порт 3000).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app

volumes:
  coverscache:
  pgdata18:
  archivedata:
  cargo-registry:
  app-target:
  tools-cargo:
  tools-target:

# Dev-окружение Nexus.
# Креды заданы дефолтами прямо здесь — окружение поднимается без дополнительных файлов.
# Чтобы переопределить, создайте infra/.env с теми же ключами: compose подхватит его автоматически.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-nexus_dev_master_key}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    container_name: nexus-app
    restart: unless-stopped
    command: ["cargo", "watch", "-x", "run -p nexus"]
    volumes:
      - ..:/app
      - cargo-registry:/cargo-cache
      # Сборка вне /app (CARGO_TARGET_DIR=/target в Dockerfile.dev): в проекте не появляется target/ от root.
      - app-target:/target
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nexus_user}:${POSTGRES_PASSWORD:-nexus_password}@postgres:5432/${POSTGRES_DB:-nexus_db}
      REDIS_URL: redis://redis:6379
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-nexus_dev_master_key}
      # Не короче 32 символов. В проде — свой случайный секрет (openssl rand -base64 48).
      JWT_SECRET: ${JWT_SECRET:-nexus-dev-jwt-secret-change-me-in-production}
      # Письма уходят в Mailpit: веб-интерфейс http://localhost:8025.
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-Nexus <no-reply@nexus.local>}
      # Фронтенд: из него строятся ссылки в письмах.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      # Публичный адрес API: из него строится redirect_uri для OAuth-провайдеров.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      # POST /api/v1/auth/dev/login — вход под любым пользователем. Только для dev, в проде false.
      DEV_LOGIN: ${DEV_LOGIN:-true}
      # OAuth-провайдеры включаются ключами (как получить — documents/modules/auth.md):
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_YANDEX_CLIENT_ID: ${OAUTH_YANDEX_CLIENT_ID:-}
      OAUTH_YANDEX_CLIENT_SECRET: ${OAUTH_YANDEX_CLIENT_SECRET:-}
      # Постеры и трейлеры (nexus media fill|check, make media): TMDB — фильмы и сериалы,
      # IGDB через приложение Twitch — игры. Без ключей ищутся только обложки книг и Rutube.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info,tower_http=debug}
      RUST_BACKTRACE: "1"
      # На машине ~6 ГБ свободной RAM: без лимита параллельные rustc её выедают.
      CARGO_BUILD_JOBS: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Инструменты разработчика без Rust на машине: make ci-docker, make test-docker, make shell.
  # Не стартует с make up (profile tools), запускается через docker compose run. Свои тома для
  # сборки и кеша крейтов: не мешает cargo watch в app. Запускается от пользователя хоста
  # (--user в Makefile), чтобы созданные файлы (fmt, documents/api) не стали root'овыми.
  tools:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    profiles: ["tools"]
    volumes:
      - ..:/app
      - tools-cargo:/cargo-cache
      - tools-target:/target
    environment:
      HOME: /tmp
      DATABASE_URL: postgres://${POSTGRES_USER:-nexus_user}:${POSTGRES_PASSWORD:-nexus_password}@postgres:5432/${POSTGRES_DB:-nexus_db}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-nexus_dev_master_key}
      CARGO_BUILD_JOBS: "2"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  # Ловушка для писем в dev: всё, что отправляет приложение, видно на http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"   # веб-интерфейс и API
      - "1025:1025"   # SMTP

  nginx:
    image: nginx:1.27-alpine
    container_name: nexus-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_common.conf:/etc/nginx/proxy_common.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  meilidata:
  cargo-registry:
  app-target:
  tools-cargo:
  tools-target:

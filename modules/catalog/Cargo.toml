[package]
name = "catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
shared = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
# Поток событий публикации (SSE) из канала.
futures-util = { workspace = true }
# Дамп TMDB для «обновить popularity» (catalog::tmdb).
flate2 = { workspace = true }
# Холодный архив: индекс Tantivy и TSV-дамп (catalog::archive).
tantivy = { workspace = true }
# Слой Б книжного поиска: фасеты (RoaringBitmap) и подмена состояния (ArcSwap).
roaring = { workspace = true }
# Колонки слоя Б из отображённого файла в `&[T]` без своего unsafe.
bytemuck = { version = "1", features = ["derive"] }
# Те же версии, что у Tantivy: исправление опечатки обходит словарь автоматом Левенштейна.
tantivy-fst = "0.5"
levenshtein_automata = "0.2"
regex = { workspace = true }
arc-swap = { workspace = true }
# Читалка книг: EPUB из архивов .arx (catalog::books::reader).
libarx = { workspace = true }
relative-path = { workspace = true }
csv = { workspace = true }
# Возврат из архива: лимит авто-возвратов в час и slug людей из имени (NFKD).
governor = { workspace = true }
unicode-normalization = { workspace = true }
# content_html баннеров: allowlist-санитизация на сервере (catalog::banners).
ammonia = { workspace = true }

[dev-dependencies]
shared = { workspace = true, features = ["mock"] }
mockall = { workspace = true }

[package]
name = "catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
shared = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
# Поток событий публикации (SSE) из канала.
futures-util = { workspace = true }
# Дамп TMDB для «обновить popularity» (catalog::tmdb).
flate2 = { workspace = true }
# Холодный архив: индекс Tantivy и TSV-дамп (catalog::archive).
tantivy = { workspace = true }
csv = { workspace = true }
# Возврат из архива: лимит авто-возвратов в час и slug людей из имени (NFKD).
governor = { workspace = true }
unicode-normalization = { workspace = true }
# content_html баннеров: allowlist-санитизация на сервере (catalog::banners).
ammonia = { workspace = true }

[dev-dependencies]
shared = { workspace = true, features = ["mock"] }
mockall = { workspace = true }

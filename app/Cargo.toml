utoipa-swagger-ui = { workspace = true }
# Аллокатор, который возвращает ОС освобождённую память: со стандартным glibc после одной
# пересборки слоя Б (живых данных ~80 МБ) процесс оставался с ~600 МБ из-за фрагментации кучи.
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
test-utils = { workspace = true }
# Картинки для проверки вложений чата собираются на лету, а не лежат в фикстурах.
image = { workspace = true }

# Конфиг cargo-deny: уязвимости, лицензии, источники зависимостей.
# Запуск: cargo deny check

[graph]
all-features = true

[advisories]
# Уязвимости из RustSec — ошибка; unmaintained-крейты — только среди прямых зависимостей.
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Наши crate'ы (publish = false) не проверяем: у них license = "proprietary".
[licenses.private]
ignore = true

[bans]
# Несколько версий одного крейта — нормально для транзитивных зависимостей, но стоит видеть.
multiple-versions = "warn"
wildcards = "deny"
# path-зависимости внутри workspace без версии — это нормально.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

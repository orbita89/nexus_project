[workspace]
resolver = "2"
members = [
    "app",
    "modules/auth",
    "modules/catalog",
    "modules/social",
    "modules/realtime",
    "libs/shared",
    "libs/test-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
shared = { path = "libs/shared" }
test-utils = { path = "libs/test-utils" }
auth = { path = "modules/auth" }
catalog = { path = "modules/catalog" }
social = { path = "modules/social" }
realtime = { path = "modules/realtime" }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
argon2 = "0.6"
sha2 = "0.11"
utoipa = { version = "6", features = ["uuid", "chrono"] }
utoipa-axum = "0.3"
# vendored: Swagger UI вшивается в бинарник, сборка не ходит за ним в интернет.
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
governor = "0.10"
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "hostname",
    "tokio1-rustls-tls",
] }
http-body-util = "0.1"
# OAuth: обмен кода на токен и запрос профиля у провайдера. rustls на ring, как у lettre.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
# Трейты-справочники в shared::directory: async fn в dyn-трейтах пока нестабильны.
async-trait = "0.1"
# WebSocket-клиент для тестов realtime (те же версии, что у axum).
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[profile.dev]
# Меньше отладочной информации -> заметно быстрее линковка и меньше target/ при hot-reload.
debug = 1

# Argon2 без оптимизаций считает хеш секундами: тормозят вход в dev и тесты авторизации.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
